<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Décroissance radioactive</title><style>body{font-family:Arial;margin:12px;color:#222}.layout{display:grid;grid-template-columns:minmax(430px,1fr) 500px;gap:14px}.controls{background:#f1f4f7;padding:8px;border-radius:8px}.topline{display:flex;align-items:center;gap:8px;flex-wrap:nowrap}.equation{font-size:18px;padding:6px 8px;background:#fff8df;border-left:4px solid #d49b00;white-space:nowrap;flex:1}.legend{white-space:nowrap;font-size:13px}.parentText{color:#c62828;font-weight:bold}.daughterText{color:#1565c0;font-weight:bold}.gamma{color:#6a1b9b;font-weight:bold}label{display:inline-block;margin:3px 6px 3px 0}input,select,button{font-size:14px;padding:4px;margin:2px}.warning{color:#b00020;font-weight:bold;min-height:18px}.sample{position:relative;border:1px solid #aaa;padding:7px;height:380px;overflow:auto;background:#fafafa}.sample canvas{display:block}.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin:0 3px 0 8px;border:1px solid #555}.red{background:#e74c3c}.blue{background:#4a90e2}.tablebox{height:240px;overflow:auto;border:1px solid #999}.tablebox table{border-collapse:collapse;width:100%;font-size:13px}td,th{border:1px solid #aaa;padding:4px;white-space:nowrap;text-align:right}th{background:#eee;position:sticky;top:0}.chartbox{border:1px solid #999;margin-top:10px;padding:4px}.chartbox canvas{width:100%;height:280px}.combo{position:relative;display:inline-block;margin:2px 6px 2px 0;vertical-align:middle}.combo input{width:170px;margin:0;text-align:right;border:1px solid #888;border-right:none;border-radius:4px 0 0 4px}.combo input.bad{border-color:#b00020;background:#fdecea}.combo button{margin:0;border:1px solid #888;border-radius:0 4px 4px 0;background:#e8edf2;cursor:pointer}.dtlist{position:absolute;top:100%;left:0;min-width:100%;box-sizing:border-box;margin:2px 0 0;padding:0;list-style:none;background:#fff;border:1px solid #888;border-radius:4px;box-shadow:0 3px 8px rgba(0,0,0,.25);z-index:20}.dtlist li{padding:6px 12px;cursor:pointer;white-space:nowrap;font-size:14px}.dtlist li:hover{background:#dbe8f7}.dtlist li b{display:inline-block;min-width:112px;text-align:right;margin-right:10px}.btns{display:flex;align-items:center;flex-wrap:wrap;gap:4px;margin-top:4px}.btns button{margin:2px 0}#reset{margin-left:30px;background:#2e9e4f;color:#fff;font-weight:bold;border:1px solid #237a3c;border-radius:4px;padding:4px 14px;cursor:pointer}#reset:hover{background:#237a3c}@media(max-width:1000px){.layout{grid-template-columns:1fr}.topline{flex-wrap:wrap}.sample{height:330px}}</style></head><body><h1>Décroissance radioactive</h1><div class="layout"><section><div class="controls"><div class="topline"><label>Noyau : <select id="iso"><option value="Rn">Radon 222</option><option value="Ra">Radium 226</option><option value="U">Uranium 238</option></select></label><div id="equation" class="equation"></div><div class="legend"><span class="dot red"></span>noyau père <span class="dot blue"></span>noyau fils</div></div><div><label>Nombre initial N₀ de noyaux : <input id="n0" type="number" min="1" value="1000"></label><div id="warning" class="warning"></div></div><div><label for="dt">Durée entre deux observations (pas) :</label><span class="combo" id="combo"><input id="dt" type="text" inputmode="decimal" autocomplete="off" value="100"><button type="button" id="dtArrow" aria-label="Choisir une durée prédéfinie" aria-haspopup="listbox" aria-expanded="false">▾</button><ul id="dtList" class="dtlist" role="listbox" hidden><li role="option" data-v="100"><b>100</b>cent</li><li role="option" data-v="1000"><b>1&#8239;000</b>mille</li><li role="option" data-v="1000000"><b>1&#8239;000&#8239;000</b>million</li><li role="option" data-v="1000000000"><b>1&#8239;000&#8239;000&#8239;000</b>milliard</li></ul></span><label>Unité : <select id="unit"><option value="day">jours</option><option value="year">années</option><option value="second">secondes</option></select></label></div><div class="btns"><button id="step" title="Fait avancer le temps d’un pas (durée entre deux observations)">Avancer d’un pas</button><button id="run" title="Enchaîne les pas automatiquement jusqu’à Pause">Enchaîner les pas</button><button id="pause">Pause</button><button id="reset" title="Recommence une nouvelle expérience avec les réglages choisis">Réinitialiser</button></div></div><h3>Population : <span id="count"></span> noyaux</h3><div id="sample" class="sample"><canvas id="sampleCanvas"></canvas></div></section><section><h3>Données</h3><div id="tablebox" class="tablebox"><table><thead><tr><th>Temps</th><th>Pères</th><th>Fils</th><th>Désintégrations</th></tr></thead><tbody id="data"></tbody></table></div><p><button id="copy">Copier toutes les données</button><button id="csv">Télécharger CSV</button></p><div class="chartbox"><canvas id="chart" width="500" height="310"></canvas></div></section></div><script>const I={Rn:{name:'Radon 222',h:3.823,e:'²²²₈₆Rn → ²¹⁸₈₄Po + ⁴₂He + γ'},Ra:{name:'Radium 226',h:1600,e:'²²⁶₈₈Ra → ²²²₈₆Rn + ⁴₂He + γ'},U:{name:'Uranium 238',h:4.468e9,e:'²³⁸₉₂U → ²³⁴₉₀Th + ⁴₂He + γ'}};const F={year:{Rn:1/365.25,Ra:1,U:1},day:{Rn:1,Ra:365.25,U:365.25},second:{Rn:86400,Ra:31557600,U:31557600}};const MAX=20000;let total=1000,parent=1000,daughter=0,t=0,rows=[],runTimer=null,states=[],size=8,cols=1,flashAnim=null,$=id=>document.getElementById(id);function pause(){clearTimeout(runTimer);runTimer=null;if(flashAnim){cancelAnimationFrame(flashAnim);flashAnim=null}}function reset(){pause();let q=parseInt($('n0').value)||1;if(q>MAX){total=MAX;$('n0').value=MAX;$('warning').textContent='Attention : la simulation est limitée à 20 000 noyaux. La valeur a été ramenée à 20 000.'}else{$('warning').textContent='';total=Math.max(1,q)}parent=total;daughter=0;t=0;states=Array(total).fill('p');rows=[[0,total,0,0]];layoutCanvas();drawPopulation();renderHeader();renderTableFull();draw()}function step(){if(!parent)return pause();let k=$('iso').value,u=$('unit').value,dt=getDt(),p=1-Math.pow(2,-dt/(I[k].h*F[u][k])),dec=[];for(let i=0;i<total;i++)if(states[i]==='p'&&Math.random()<p)dec.push(i);dec.forEach(i=>states[i]='f');parent-=dec.length;daughter+=dec.length;t+=dt;let rw=[t,parent,daughter,dec.length];rows.push(rw);renderTableAppend(rw);drawPopulation(dec);draw()}function renderHeader(){$('count').textContent=total.toLocaleString('fr-FR');let e=I[$('iso').value].e.split(' → ');$('equation').innerHTML='<span class="parentText">'+e[0]+'</span> → <span class="daughterText">'+e[1].replace(' + γ','')+'</span> + <span class="gamma">γ</span>'}function layoutCanvas(){const c=$('sample'),cv=$('sampleCanvas');size=Math.max(3,Math.min(14,Math.sqrt(360000/total)));const avail=Math.max(size,c.clientWidth-16);cols=Math.max(1,Math.floor(avail/size));const rn=Math.ceil(total/cols),dpr=window.devicePixelRatio||1;cv.style.width=(cols*size)+'px';cv.style.height=(rn*size)+'px';cv.width=Math.round(cols*size*dpr);cv.height=Math.round(rn*size*dpr);const ctx=cv.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0)}function paintGrid(ctx,glow){const rn=Math.ceil(total/cols);ctx.clearRect(0,0,cols*size,rn*size);const r=(size-1)/2,stroke=size>=5&&total<=4000;for(let i=0;i<total;i++){const cx=(i%cols)*size+size/2,cy=Math.floor(i/cols)*size+size/2;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fillStyle=states[i]==='p'?'#e74c3c':'#4a90e2';ctx.fill();if(stroke){ctx.strokeStyle='#777';ctx.lineWidth=1;ctx.stroke()}}if(glow)glow.forEach(({i,a})=>{const cx=(i%cols)*size+size/2,cy=Math.floor(i/cols)*size+size/2,rad=r*(1+6*(1-a));const g=ctx.createRadialGradient(cx,cy,0,cx,cy,rad);g.addColorStop(0,'rgba(255,245,157,'+a+')');g.addColorStop(.5,'rgba(255,213,79,'+(a*.7)+')');g.addColorStop(1,'rgba(255,152,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,rad,0,Math.PI*2);ctx.fill()})}const FLASH_CAP=400,FLASH_MS=550;function drawPopulation(dec){const ctx=$('sampleCanvas').getContext('2d');if(flashAnim){cancelAnimationFrame(flashAnim);flashAnim=null}if(!dec||!dec.length||dec.length>FLASH_CAP){paintGrid(ctx,null);return}const idx=dec,start=performance.now();function frame(now){const p=Math.min(1,(now-start)/FLASH_MS);paintGrid(ctx,idx.map(i=>({i,a:1-p})));if(p<1)flashAnim=requestAnimationFrame(frame);else{flashAnim=null;paintGrid(ctx,null)}}flashAnim=requestAnimationFrame(frame)}function rowHtml(r){return '<tr>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>'}function scrollTableBottom(){requestAnimationFrame(()=>{$('tablebox').scrollTop=$('tablebox').scrollHeight})}function renderTableFull(){$('data').innerHTML=rows.map(rowHtml).join('');scrollTableBottom()}function renderTableAppend(r){$('data').insertAdjacentHTML('beforeend',rowHtml(r));scrollTableBottom()}function runLoop(){const t0=performance.now();step();if(!parent){runTimer=null;return}const el=performance.now()-t0;runTimer=setTimeout(runLoop,Math.max(0,300-el))}function draw(){let c=$('chart'),x=c.getContext('2d'),w=c.width,h=c.height,L=65,R=18,T=20,B=55,gw=w-L-R,gh=h-T-B;x.clearRect(0,0,w,h);x.strokeStyle='#222';x.fillStyle='#222';x.beginPath();x.moveTo(L,T);x.lineTo(L,h-B);x.lineTo(w-R,h-B);x.stroke();x.font='12px Arial';x.textAlign='right';[0,total/2,total].forEach(v=>{let y=h-B-gh*v/total;x.strokeStyle='#bbb';x.beginPath();x.moveTo(L,y);x.lineTo(w-R,y);x.stroke();x.fillStyle='#222';x.fillText(fmt(v),L-7,y+4)});let mt=rows.length?rows[rows.length-1][0]:1;for(let i=0;i<=4;i++){let val=mt*i/4,xp=L+gw*i/4;x.strokeStyle='#ddd';x.beginPath();x.moveTo(xp,T);x.lineTo(xp,h-B);x.stroke();x.fillStyle='#222';x.textAlign='center';x.fillText(fmt(val),xp,h-B+18)}x.textAlign='center';x.fillText('t : durée ('+$('unit').options[$('unit').selectedIndex].text+')',L+gw/2,h-8);x.save();x.translate(14,T+gh/2);x.rotate(-Math.PI/2);x.fillText('N(t) : nombre de noyaux pères',0,0);x.restore();if(rows.length<2)return;x.strokeStyle='#d33';x.lineWidth=2;x.beginPath();rows.forEach((r,i)=>{let X=L+gw*r[0]/mt,Y=h-B-gh*r[1]/total;i?x.lineTo(X,Y):x.moveTo(X,Y)});x.stroke()}function fmt(v){return Number.isInteger(v)?v.toLocaleString('fr-FR'):v.toLocaleString('fr-FR',{maximumFractionDigits:2})}function copy(){let u=$('unit'),s='Noyau : '+I[$('iso').value].name+'\nÉquation : '+I[$('iso').value].e+'\nNombre initial N₀ : '+total+'\nDurée entre deux observations : '+getDt()+' '+u.options[u.selectedIndex].text+'\n\nTemps\tPères\tFils\tDésintégrations\n'+rows.map(r=>r.join('\t')).join('\n');let ta=document.createElement('textarea');ta.value=s;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();alert('Données copiées')}function csv(){let s='Noyau;'+I[$('iso').value].name+'\nÉquation;'+I[$('iso').value].e+'\nNombre initial N₀;'+total+'\nDurée;'+getDt()+'\n\nTemps;Pères;Fils;Désintégrations\n'+rows.map(r=>r.join(';')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'text/csv'}));a.download='donnees_decroissance.csv';a.click()}$('step').onclick=step;$('run').onclick=()=>{pause();runLoop()};$('pause').onclick=pause;$('reset').onclick=reset;window.addEventListener('resize',()=>{layoutCanvas();drawPopulation()});function parseDt(){return parseFloat($('dt').value.replace(/\s/g,'').replace(',','.'))}function getDt(){let v=parseDt();return Math.max(.001,isNaN(v)?1:v)}function openList(o){$('dtList').hidden=!o;$('dtArrow').setAttribute('aria-expanded',o)}$('dtArrow').onclick=e=>{e.stopPropagation();openList($('dtList').hidden)};$('dtList').onclick=e=>{let li=e.target.closest('li');if(!li)return;$('dt').value=Number(li.dataset.v).toLocaleString('fr-FR');$('dt').classList.remove('bad');openList(false);$('dt').focus()};document.addEventListener('click',e=>{if(!$('combo').contains(e.target))openList(false)});$('dt').onkeydown=e=>{if(e.key==='Escape')openList(false);if(e.key==='ArrowDown'){e.preventDefault();openList(true)}};$('dt').oninput=()=>{let v=parseDt();$('dt').classList.toggle('bad',isNaN(v)||v<=0)};$('iso').onchange=reset;$('unit').onchange=reset;$('n0').oninput=reset;$('copy').onclick=copy;$('csv').onclick=csv;reset()</script></body></html>
